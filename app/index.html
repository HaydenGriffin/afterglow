<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Afterglow</title>
<link rel="icon" href="./favicon.ico" sizes="16x16 32x32">
<link rel="icon" href="./favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="./player.css">
<link rel="stylesheet" href="./playlists.css">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font-family: var(--face); }
  #stage { position: fixed; left: 0; top: 0; width: 100%; height: 100%; transition: transform 4s linear; }
  #stage canvas { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
  #message {
    display: none; position: fixed; left: 10vw; right: 10vw; top: 46%;
    text-align: center; color: var(--paper-2); font-size: 3vh; transition: transform 4s linear;
  }
  /* Waiting for music, a passing state: the small wordmark above the line,
     an x-height clear of it; the pair stays centred where the line was. */
  #message.waiting { margin-top: -8.4vh; }
  #message.waiting::before {
    content: ""; display: block; width: 24.93vh; height: 5vh; margin: 0 auto 3.4vh;
    background: url(brand/afterglow-wordmark-paper.svg) no-repeat 0 0; background-size: 100% 100%;
  }
  #hint {
    position: fixed; right: 5vw; bottom: 5vh; padding: 1.2vh 1.2vw;
    background: var(--ink); color: var(--paper); font-size: 2.2vh; font-weight: 600;
    opacity: 0; transition: opacity 0.4s;
  }
  #toast {
    position: fixed; left: 50%; top: 5vh; transform: translateX(-50%); padding: 1.4vh 1.6vw;
    background: var(--paper); color: var(--ink); font-size: 2.6vh; font-weight: 700; white-space: nowrap;
    opacity: 0; transition: opacity 0.4s;
  }
  /* Visuals + track: a flat field caption over MilkDrop, set from the artwork palette. */
  #track {
    position: fixed; left: 5vw; bottom: 6vh; max-width: 62vw; padding: 2vh 1.6vw 2.2vh;
    background: rgba(18,20,23,.9); color: var(--paper);
    transition: transform 4s linear;
    pointer-events: none;
  }
  #track .slide { opacity: 0; transition: opacity 0.5s cubic-bezier(0.16, 1, 0.3, 1); }
  #track.shown .slide { opacity: 1; }
  #track:not(.shown) { background: transparent; }
  #track .line { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.15; }
  /* The title is the only thing on screen in this mode: two lines, never cut short. */
  #track #track-title { white-space: normal; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; padding-bottom: .08em; }
  #track-title { font-size: 5.4vh; font-weight: 820; font-stretch: 82%; letter-spacing: -.015em; }
  #track-artist { font-size: 3vh; font-weight: 700; margin-top: .6vh; }
  #track-album, #track-label { font-size: 2.3vh; font-weight: 500; margin-top: .4vh; }
  #menu {
    display: none; position: fixed; left: 34.16vw; right: 0; top: 0; bottom: 0; box-sizing: border-box;
    padding: 6vh 5vw 4vh 1.26vw; background: var(--ground);
    color: var(--paper); font-size: 2.5vh;
  }
  #menu .row { display: flex; justify-content: space-between; padding: 1.5vh 1vw; line-height: 1.3; font-weight: 600; border-bottom: var(--hair) solid var(--rule); }
  #menu .row span:last-child { text-align: right; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 55%; font-weight: 500; font-variant-numeric: tabular-nums; }
  #menu .row.focus { background: var(--paper); color: var(--ink); }
  #scan {
    display: none; position: fixed; left: 0; right: 0; bottom: 0; padding: 4vh 5vw 5vh;
    background: var(--ground); border-top: var(--hair) solid var(--rule);
    color: var(--paper); font-size: 2.6vh;
  }
  #scan .scan-title { font-size: 5vh; font-weight: 820; font-stretch: 82%; margin-bottom: 1vh; }
  #scan .scan-detail { color: var(--paper-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #scan .scan-hint { color: var(--paper-2); font-size: 2.2vh; margin-top: 1.5vh; }
  /* Sign-in is the brand scene (docs/brand): sky down to the horizon at 35vh,
     the wordmark standing on it at column 5 with its sun setting, the form
     below on the ink ground. The h1's SVG is as wide as the fields (44vw) and
     its baseline is 80.91% of its height down, so the horizon and the
     baseline are one line at any aspect ratio. */
  #login {
    display: none; position: fixed; left: 0; top: 0; width: 100%; height: 100%;
    flex-direction: column; align-items: flex-start; justify-content: flex-start; box-sizing: border-box; padding: 42vh 0 0 35.42vw;
    background: var(--ink); color: var(--paper); font-size: 2.6vh;
  }
  #login::before { content: ""; position: absolute; left: 0; top: 0; right: 0; height: 35vh; background: #16233A; }
  #login h1 { position: absolute; left: 35.42vw; top: calc(35vh - 8.361vw); margin: 0; line-height: 0; }
  #login h1 svg { display: block; width: 44vw; height: 10.333vw; }
  #login p { color: var(--paper-2); margin: 0 0 3.4vh; }
  #login .field, #login .button {
    width: 44vw; margin: 0; padding: 1.8vh 1vw; box-sizing: border-box;
    border-bottom: var(--hair) solid var(--rule);
  }
  #login .field { display: flex; justify-content: space-between; align-items: center; }
  #login .field label { font-weight: 600; }
  #login .field input {
    width: 26vw; background: transparent; border: none;
    color: inherit; font: inherit; outline: none; padding: 0.4vh 0.5vw;
  }
  #login .button { margin-top: 3vh; font-weight: 800; background: var(--field-a); color: var(--on-a); border: 0; }
  #login .focus, #login .button.focus { background: var(--paper); color: var(--ink); }
  #login .login-error { color: var(--paper); font-weight: 700; min-height: 3vh; margin-top: 2vh; max-width: 44vw; }
  #login .login-note { color: var(--paper-2); font-size: 2vh; margin-top: 3vh; max-width: 44vw; line-height: 1.4; }
  #debug {
    display: none; position: fixed; left: 2vw; top: 3vh; max-width: 90vw;
    padding: 1vh 1vw; background: rgba(18, 20, 23, 0.86); color: var(--paper);
    font: 1.8vh monospace; white-space: pre-wrap; word-break: break-all;
  }
</style>
</head>
<body>
<div id="stage"><canvas id="gl"></canvas></div>
<div id="idle"></div>
<div id="message"></div>
<div id="hint">OK: player</div>
<div id="toast"></div>
<div id="track"><div class="slide">
  <div class="line" id="track-title"></div>
  <div class="line" id="track-artist"></div>
  <div class="line" id="track-album"></div>
  <div class="line" id="track-label"></div>
</div></div>
<div id="player"></div>
<div id="scan">
  <div class="scan-title"></div>
  <div class="scan-detail"></div>
  <div class="scan-hint"></div>
</div>
<div id="login">
