requirements:
  webosRelease: '>=5.0'
description: |
  # Afterglow

  A [Music Assistant](https://music-assistant.io/) companion for your TV. It draws
  MilkDrop visuals in time with whatever your speakers are playing, from the waveform
  Music Assistant's **MilkDrop Visualizer** plugin streams a few seconds ahead, and
  shows the album artwork, timed lyrics and the queue, with playback from the remote.

  ![A preset playing](https://raw.githubusercontent.com/HaydenGriffin/afterglow/main/docs/screenshots/playing.jpg)

  ## What it does

  - Follows whichever speaker is playing, or the one you pick; sync groups are resolved the way Music Assistant does.
  - Visuals, visuals with a track card, album artwork, or lyrics (timed where available).
  - Play/pause, skip, seek, the queue, favourites, shuffle/repeat, volume and a sleep timer; browse playlists, albums and radio.
  - Ships all 395 presets from the butterchurn-presets packs. **Scan presets** measures each one's frame rate on *your* TV and builds a *validated* list of the ones it runs smoothly.
  - Favourites, shared with Music Assistant's own MilkDrop favourites and between your TVs.
  - Presets can take their colours from the album art.
  - Optional **Play on this TV**: the TV becomes a Music Assistant speaker through Sendspin.
  - Keeps the screensaver off while music plays; nudges the picture against OLED burn-in.

  ![The menu](https://raw.githubusercontent.com/HaydenGriffin/afterglow/main/docs/screenshots/menu.jpg)

  ## Requirements

  - Music Assistant 2.10 or newer, on the same network, with the MilkDrop Visualizer plugin added (Settings → Plugins).
  - Speakers Music Assistant streams to itself (Sonos, Chromecast, AirPlay, Squeezelite, …). A speaker playing something on its own, such as Spotify straight from the Spotify app, carries nothing it can draw.
  - A TV with WebGL2 (LG's 2020 models onward). Tested on an LG CX (webOS 5) and C1 (webOS 6). No root required.

  ## Setting up

  On first launch, sign in with Music Assistant's address and your username and password.
  The TV gets its own long-lived token, named after it, which you can revoke in Music
  Assistant's settings or with **Log out**; the password is not stored.
  Then run **Scan presets** once. The [setup guide](https://github.com/HaydenGriffin/afterglow/blob/main/docs/install.md)
  walks through everything; [the preset scan](https://github.com/HaydenGriffin/afterglow/blob/main/docs/preset-scan.md)
  explains how the validated list works.

  ![Sign in](https://raw.githubusercontent.com/HaydenGriffin/afterglow/main/docs/screenshots/sign-in.jpg)

  ## Source

  [github.com/HaydenGriffin/afterglow](https://github.com/HaydenGriffin/afterglow) (MIT), based on Michael Nestrud's
  [viz-man](https://github.com/mnestrud/viz-man). Rendering by the
  [Music Assistant fork](https://github.com/music-assistant/butterchurn) of
  [Butterchurn](https://github.com/jberg/butterchurn) and the butterchurn-presets packs (MIT);
  Sendspin playback by [sendspin-js](https://github.com/Sendspin/sendspin-js) (Apache-2.0).
